<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lura RWL Bingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="card-page">

<main class="card-container">

    <header class="page-header">
        <h1>Lura RWL Bingo</h1>
        <p>Selected 25 Variant. Automatically Saves.</p>
    </header>

    <section id="selectionArea">

        <div class="drag-layout">

            <div class="available-container">
                <h2>Available Squares</h2>
                <p class="drag-help">Drag a card onto an empty space.</p>

                <div id="itemList" class="item-list"></div>
            </div>

            <div class="setup-container">
                <h2>Your Card</h2>

                <div class="bingo-wrapper">
                    <div id="setupCard" class="bingo-card setup-card"></div>
                </div>

                <div id="selectionCount" class="selection-count">
                    0 / 24 selected
                </div>

                <div class="controls">
                    <button
                        id="enableCardButton"
                        class="btn btn-primary"
                        disabled
                    >
                        Enable Card
                    </button>

                    <a href="index.html" class="btn">
                        ← Go Back
                    </a>
                </div>
            </div>

        </div>

    </section>

    <section id="generatedArea" class="hidden">
    
        <div class="controls">

            <a href="index.html" class="btn">
                ← Go Back
            </a>
            
            <button id="shareButton" class="btn btn-primary">
                📋 Share Card
            </button>
    
            <button id="resetButton" class="btn btn-danger">
                Reset Card
            </button>

        </div>
    
        <div class="bingo-wrapper generated-wrapper">
            <div id="generatedCard" class="bingo-card"></div>
        </div>
    
        <div class="bingo-message"></div>
    
    </section>

</main>

<script src="bingo-data.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="app.js"></script>

</body>
</html>
